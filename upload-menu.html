// ========== UPLOAD FUNKTION ==========
async function uploadMenu() {
    const statusDiv = document.getElementById('status');
    statusDiv.className = 'info';
    statusDiv.textContent = '⏳ Upload läuft...';

    let totalCount = 0;
    let successCount = 0;

    try {
        for (const [category, items] of Object.entries(dishes)) {
            for (let i = 0; i < items.length; i++) {
                const dish = items[i];
                totalCount++;

                try {
                    await db.collection('menu').add({
                        category: category,
                        nr: dish.nr || i + 1,
                        name: dish.name,
                        ingredients: dish.ingredients || '',
                        price: dish.price,
                        vegetarian: dish.vegetarian || false,
                        available: true,
                        order: i + 1,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    successCount++;
                    console.log(`✅ ${category}: ${dish.name}`);

                } catch (error) {
                    console.error(`❌ Fehler bei ${dish.name}:`, error);
                }
            }
        }

        statusDiv.className = 'success';
        statusDiv.textContent = `✅ Erfolg! ${successCount} von ${totalCount} Gerichten hochgeladen!`;

    } catch (error) {
        statusDiv.className = 'error';
        statusDiv.textContent = `❌ Fehler: ${error.message}`;
        console.error(error);
    }
}
